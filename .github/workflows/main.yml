name: Daily Programming Upload

on:
  schedule:
    - cron: "30 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upload-programs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upload two programs
        run: python .github/daily_upload.py

      - name: Commit and push changes
        run: |
          git config user.name "manisha-junare01"
          git config user.email "149325785+manisha-junare01@users.noreply.github.com"
          git add 03-Logic-Building/Practice .github/uploaded_programs.json
          git diff --cached --quiet || git commit -m "Daily programming practice upload"
          git push

